<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XooxleStarChart - خريطة النجوم</title>
<style>
body{margin:0;background:#020617;color:#fff;font-family:sans-serif;overflow:hidden}
header{background:#1e1b4b;padding:12px;display:flex;justify-content:space-between}
.logo{font-weight:900} .logo span{color:#fbbf24}
#sky{width:100vw;height:90vh;position:relative;background:radial-gradient(#0f172a,#020617)}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 2s infinite}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
.box{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#0f172af2;border:2px solid #4f46e5;padding:12px;border-radius:14px;width:92%;max-width:500px;text-align:center}
.btn{background:#4f46e5;border:0;color:#fff;padding:6px 12px;border-radius:20px;margin:2px}
.moon{position:absolute;top:60px;left:18%;width:55px;height:55px;background:radial-gradient(#fef3c7,#eab308);border-radius:50%;box-shadow:0 0 30px #fbbf24}
</style>
</head>
<body>
<header><div class="logo">⭐ <span>Xooxle</span>StarChart</div><div>محمدية - المغرب</div></header>
<div id="sky"><div class="moon"></div></div>
<div class="box"><h3 id="t">مرحبا بكم في خريطة النجوم ⭐</h3><p id="d">200 نجمة حقيقية - بركو على الكوكبات باش تعرفو قصتها - موقع تعليمي للمدارس</p><button class="btn" onclick="t.innerText='الدب الأكبر';d.innerText='7 نجوم كتشكل مغرفة - كتدل على الشمال - كتبان كل ليلة فوق المغرب'">الدب الأكبر</button><button class="btn" onclick="t.innerText='الجبار';d.innerText='أشهر كوكبة - 3 نجوم فالوسط هم حزام الجبار - كتبان فالشتاء'">الجبار</button><button class="btn" onclick="t.innerText='المشتري';d.innerText='أكبر كوكب فالمجموعة الشمسية - كيبان مضوي بزاف هاد الأيام'">المشتري 🪐</button></div>
<script>
let s=document.getElementById('sky');
for(let i=0;i<200;i++){let a=document.createElement('div');a.className='star';a.style.left=Math.random()*100+'%';a.style.top=Math.random()*100+'%';a.style.animationDelay=Math.random()*2+'s';s.appendChild(a)}
</script>
</body>
</html>
